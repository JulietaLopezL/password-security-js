<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Contraseña Segura</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <main class="container">
    <h1>Contraseña Segura 🔐</h1>

    <section class="generator">
      <h2>Generar contraseña </h2>

      <label>
        Longitud:
        <input type="number" id="lengthInput" min="6" max="64" value="12">
      </label>
      <div id="Message"  class="error-message"></div>

      <div class="options">
        <label>
          <input type="checkbox" id="lowerCheckbox" checked>
          Minúsculas
        </label>
        <label>
          <input type="checkbox" id="upperCheckbox" checked>
          Mayúsculas
        </label>
        <label>
          <input type="checkbox" id="numbersCheckbox" checked>
          Números
        </label>
        <label>
          <input type="checkbox" id="symbolsCheckbox">
          Símbolos
        </label>

       <div id="Message"  class="error-message"></div>

      </div>

      <button id="generateBtn">Generar</button>

      <div class="result">
        <label>Contraseña generada:</label>
        <input type="text" id="passwordOutput" readonly>
        <button id="copyBtn" >Copiar</button>
        
      <div id="Message"  class="error-message"></div>

      </div>
    </section>

    <section class="strength">
      <h2>Fuerza de la contraseña 💪</h2>
      <p id="strengthLabel">Sin evaluar</p>
      <div class="strength-bar">
        <div id="strengthFill"></div>
      </div>
    </section>

    <section class="history">

       <div id="historyGenerator">
        <button id="historyGeneratorBtn" style="padding-top: 0.5rem;">Visualizar historial</button>
      </div>

      <h2>Historial de contraseñas generadas 📊</h2>
      <ul id="historyList"></ul>
      <div id="cleanHistory">
        <button id="clearHistoryBtn">Limpiar historial</button>
      </div>
    </section>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
